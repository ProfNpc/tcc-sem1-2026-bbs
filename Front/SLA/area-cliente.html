<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cliente | Bits Bytes Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff416c;
            --grad: linear-gradient(45deg,#ff416c,#ff4b2b);
            --bg: #050505;
            --glass: rgba(18,18,18,0.7);
            --border: rgba(255,255,255,0.07);
            --muted: #666;
            --success: #00e87a;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Poppins',sans-serif;background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;
            background-image:radial-gradient(circle at 10% 40%,rgba(255,65,108,.07),transparent 40%),
                             radial-gradient(circle at 90% 20%,rgba(255,75,43,.07),transparent 40%);
        }

        /* HEADER */
        header{
            padding:18px 5%;
            background:rgba(10,10,10,.8);
            border-bottom:1px solid var(--border);
            backdrop-filter:blur(20px);
            position:sticky;top:0;z-index:50;
            display:flex;align-items:center;justify-content:space-between;
        }
        .logo{font-size:1.7rem;font-weight:700;letter-spacing:4px;
            background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
            text-decoration:none;cursor:pointer}
        .back-link{display:flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;
            font-size:.82rem;font-weight:500;letter-spacing:1px;text-transform:uppercase;transition:color .2s}
        .back-link:hover{color:#fff}
        .back-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}

        /* LAYOUT */
        .wrap{display:grid;grid-template-columns:260px 1fr;gap:28px;
            max-width:1060px;width:90%;margin:50px auto;align-items:start;flex:1}

        /* SIDEBAR */
        .sidebar{background:var(--glass);border:1px solid var(--border);border-radius:18px;
            backdrop-filter:blur(20px);overflow:hidden;position:sticky;top:94px}
        .sb-top{padding:30px 22px 24px;text-align:center;
            background:linear-gradient(180deg,rgba(255,65,108,.06),transparent);
            border-bottom:1px solid var(--border)}
        .avatar{width:72px;height:72px;border-radius:50%;background:var(--grad);
            display:flex;align-items:center;justify-content:center;
            font-size:1.6rem;font-weight:700;margin:0 auto 14px;
            box-shadow:0 0 28px rgba(255,65,108,.35)}
        .sb-nome{font-size:1rem;font-weight:600;margin-bottom:3px}
        .sb-email{font-size:.75rem;color:var(--muted)}
        nav{padding:10px 0}
        .nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 22px;
            background:none;border:none;border-left:3px solid transparent;
            color:#888;font-family:'Poppins',sans-serif;font-size:.86rem;font-weight:500;
            cursor:pointer;transition:all .2s;text-align:left}
        .nav-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
        .nav-btn:hover{color:#ddd;background:rgba(255,255,255,.03)}
        .nav-btn.active{color:#fff;background:rgba(255,65,108,.08);border-left-color:var(--primary)}
        .sb-sair{margin:8px 16px 16px;width:calc(100% - 32px);padding:10px;
            background:transparent;border:1px solid rgba(255,65,108,.22);border-radius:9px;
            color:var(--primary);font-family:'Poppins',sans-serif;font-size:.78rem;font-weight:600;
            text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:.2s}
        .sb-sair:hover{background:rgba(255,65,108,.1)}

        /* MAIN */
        .main{background:var(--glass);border:1px solid var(--border);border-radius:18px;
            backdrop-filter:blur(20px);overflow:hidden}
        .section{display:none;padding:36px 38px}
        .section.active{display:block}
        .sec-titulo{font-size:1.15rem;font-weight:700;text-transform:uppercase;letter-spacing:3px;margin-bottom:5px}
        .sec-sub{font-size:.8rem;color:var(--muted);padding-bottom:22px;
            border-bottom:1px solid var(--border);margin-bottom:28px}

        /* FIELDS */
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
        .full{grid-column:1/-1}
        .field{display:flex;flex-direction:column;gap:6px}
        .field label{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
        .field input{padding:12px 15px;background:rgba(255,255,255,.04);
            border:1px solid rgba(255,255,255,.09);border-radius:9px;
            color:#fff;font-family:'Poppins',sans-serif;font-size:.88rem;outline:none;transition:.2s}
        .field input:focus{border-color:rgba(255,65,108,.5);background:rgba(255,65,108,.05);
            box-shadow:0 0 0 3px rgba(255,65,108,.08)}
        .field input::placeholder{color:#3a3a3a}

        .cep-row{display:flex;gap:9px}
        .cep-row input{flex:1}
        .btn-cep{padding:12px 16px;background:var(--grad);border:none;border-radius:9px;
            color:#fff;font-family:'Poppins',sans-serif;font-size:.8rem;font-weight:700;
            cursor:pointer;white-space:nowrap;transition:opacity .2s}
        .btn-cep:hover{opacity:.85}

        .actions{display:flex;gap:11px;margin-top:26px}
        .btn-save{padding:13px 30px;background:var(--grad);border:none;border-radius:9px;
            color:#fff;font-family:'Poppins',sans-serif;font-size:.86rem;font-weight:700;
            text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:.25s;
            box-shadow:0 6px 18px rgba(255,65,108,.25)}
        .btn-save:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,65,108,.4)}
        .btn-cancel{padding:13px 22px;background:transparent;border:1px solid rgba(255,255,255,.1);
            border-radius:9px;color:#888;font-family:'Poppins',sans-serif;font-size:.86rem;
            cursor:pointer;transition:.2s}
        .btn-cancel:hover{color:#fff;border-color:rgba(255,255,255,.25)}

        /* ALERT */
        .alert{display:none;padding:11px 15px;border-radius:8px;font-size:.82rem;margin-bottom:22px}
        .alert.err{display:block;background:rgba(255,65,108,.1);border:1px solid rgba(255,65,108,.3);color:#ff8fa0}
        .alert.ok{display:block;background:rgba(0,232,122,.07);border:1px solid rgba(0,232,122,.2);color:var(--success)}

        /* ENDEREÇOS */
        .end-list{display:flex;flex-direction:column;gap:13px;margin-bottom:20px}
        .end-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;
            padding:17px 19px;display:flex;justify-content:space-between;align-items:flex-start;
            gap:14px;transition:border-color .2s}
        .end-card:hover{border-color:rgba(255,65,108,.25)}
        .end-apelido{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;
            color:var(--primary);margin-bottom:6px}
        .end-texto{font-size:.85rem;color:#bbb;line-height:1.7}
        .end-del{background:none;border:1px solid rgba(255,255,255,.08);border-radius:7px;
            color:#555;width:32px;height:32px;cursor:pointer;transition:.2s;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;font-size:.95rem}
        .end-del:hover{color:var(--primary);border-color:rgba(255,65,108,.3);background:rgba(255,65,108,.08)}

        .btn-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
            padding:13px;background:transparent;border:1px dashed rgba(255,65,108,.3);border-radius:11px;
            color:var(--primary);font-family:'Poppins',sans-serif;font-size:.84rem;font-weight:600;
            cursor:pointer;transition:.2s}
        .btn-add:hover{background:rgba(255,65,108,.07);border-color:var(--primary)}
        .btn-add svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.3}

        .form-end{display:none;padding-top:24px;margin-top:22px;border-top:1px solid var(--border)}
        .form-end.show{display:block}
        .form-end-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;
            color:#666;margin-bottom:18px}

        /* MOBILE */
        @media(max-width:820px){
            .wrap{grid-template-columns:1fr}
            .sidebar{position:static}
            nav{display:flex;overflow-x:auto}
            .nav-btn{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;flex-direction:column;gap:4px;padding:11px 14px}
            .nav-btn.active{border-bottom-color:var(--primary);border-left-color:transparent}
            .section{padding:24px}
            .grid{grid-template-columns:1fr}
        }
    </style>
</head>
<body>

<header>
    <a class="logo" href="index.html">BBS</a>
    <a class="back-link" href="index.html">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar à Loja
    </a>
</header>

<div class="wrap">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sb-top">
            <div class="avatar" id="av">?</div>
            <p class="sb-nome" id="sb-nome">Meu Perfil</p>
            <p class="sb-email" id="sb-email"></p>
        </div>
        <nav>
            <button class="nav-btn active" onclick="goSec('dados')">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                Dados Pessoais
            </button>
            <button class="nav-btn" onclick="goSec('enderecos')">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.3 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
                Endereços
            </button>
            <button class="nav-btn" onclick="goSec('senha')">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Alterar Senha
            </button>
        </nav>
        <button class="sb-sair" onclick="sair()">Sair da Conta</button>
    </aside>

    <!-- CONTEÚDO -->
    <main class="main">

        <!-- DADOS PESSOAIS -->
        <div class="section active" id="sec-dados">
            <p class="sec-titulo">Dados Pessoais</p>
            <p class="sec-sub">Gerencie suas informações de conta</p>
            <div class="alert" id="al-dados"></div>
            <div class="grid">
                <div class="field full"><label>Nome completo</label>
                    <input type="text" id="d-nome" placeholder="Seu nome"></div>
                <div class="field"><label>E-mail</label>
                    <input type="email" id="d-email" placeholder="seu@email.com"></div>
                <div class="field"><label>Telefone</label>
                    <input type="tel" id="d-tel" placeholder="(11) 9 9999-0000"></div>
                <div class="field"><label>CPF</label>
                    <input type="text" id="d-cpf" placeholder="000.000.000-00" maxlength="14"></div>
                <div class="field"><label>Data de nascimento</label>
                    <input type="date" id="d-nasc"></div>
            </div>
            <div class="actions">
                <button class="btn-save" onclick="salvarDados()">Salvar Alterações</button>
            </div>
        </div>

        <!-- ENDEREÇOS -->
        <div class="section" id="sec-enderecos">
            <p class="sec-titulo">Endereços</p>
            <p class="sec-sub">Endereços salvos para entrega</p>
            <div class="alert" id="al-end"></div>
            <div class="end-list" id="end-list"></div>
            <button class="btn-add" onclick="toggleFE()">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Adicionar endereço
            </button>
            <div class="form-end" id="form-end">
                <p class="form-end-label">Novo Endereço</p>
                <div class="grid">
                    <div class="field">
                        <label>CEP</label>
                        <div class="cep-row">
                            <input type="text" id="e-cep" placeholder="00000-000" maxlength="9">
                            <button class="btn-cep" onclick="buscaCEP()">Buscar</button>
                        </div>
                    </div>
                    <div class="field"><label>Apelido</label>
                        <input type="text" id="e-apelido" placeholder="Casa, Trabalho…"></div>
                    <div class="field full"><label>Rua</label>
                        <input type="text" id="e-rua" placeholder="Nome da rua"></div>
                    <div class="field"><label>Número</label>
                        <input type="text" id="e-num" placeholder="123"></div>
                    <div class="field"><label>Complemento</label>
                        <input type="text" id="e-comp" placeholder="Apto, Bloco…"></div>
                    <div class="field full"><label>Bairro</label>
                        <input type="text" id="e-bairro" placeholder="Bairro"></div>
                    <div class="field"><label>Cidade</label>
                        <input type="text" id="e-cidade" placeholder="Cidade"></div>
                    <div class="field"><label>UF</label>
                        <input type="text" id="e-uf" placeholder="SP" maxlength="2" style="text-transform:uppercase"></div>
                </div>
                <div class="actions">
                    <button class="btn-save" onclick="salvarEnd()">Salvar Endereço</button>
                    <button class="btn-cancel" onclick="toggleFE()">Cancelar</button>
                </div>
            </div>
        </div>

        <!-- SENHA -->
        <div class="section" id="sec-senha">
            <p class="sec-titulo">Alterar Senha</p>
            <p class="sec-sub">Confirme sua senha atual antes de alterar</p>
            <div class="alert" id="al-senha"></div>
            <div class="grid" style="max-width:460px">
                <div class="field full"><label>Senha atual</label>
                    <input type="password" id="s-atual" placeholder="••••••••"></div>
                <div class="field"><label>Nova senha</label>
                    <input type="password" id="s-nova" placeholder="Mínimo 6 caracteres"></div>
                <div class="field"><label>Confirmar nova senha</label>
                    <input type="password" id="s-nova2" placeholder="Repita a senha"></div>
            </div>
            <div class="actions">
                <button class="btn-save" onclick="salvarSenha()">Alterar Senha</button>
            </div>
        </div>

    </main>
</div>

<script>
    const UK = 'bbs_usuarios', SK = 'bbs_sessao';
    const getU = () => JSON.parse(localStorage.getItem(UK)   || '{}');
    const savU = u => localStorage.setItem(UK, JSON.stringify(u));
    const getS = () => JSON.parse(sessionStorage.getItem(SK) || 'null');

    function ini(n){ return (n||'?').trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase() }

    function alerta(id,msg,tipo){
        const el=document.getElementById(id);
        el.textContent=msg; el.className='alert '+tipo;
        if(tipo==='ok') setTimeout(()=>el.className='alert',3500);
    }

    function init(){
        const s=getS(), u=getU();
        const dados = s ? (u[s.email]||{}) : {};
        const nome  = s ? s.nome : 'Meu Perfil';
        const email = s ? s.email : '';

        document.getElementById('av').textContent       = ini(nome);
        document.getElementById('sb-nome').textContent  = nome;
        document.getElementById('sb-email').textContent = email;

        document.getElementById('d-nome').value  = dados.nome      || nome;
        document.getElementById('d-email').value = email;
        document.getElementById('d-tel').value   = dados.telefone  || '';
        document.getElementById('d-cpf').value   = dados.cpf       || '';
        document.getElementById('d-nasc').value  = dados.nasc      || '';
        renderEnds();
    }

    function goSec(sec){
        document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
        document.querySelector(`.nav-btn[onclick="goSec('${sec}')"]`).classList.add('active');
        document.getElementById('sec-'+sec).classList.add('active');
    }

    function sair(){
        sessionStorage.removeItem(SK);
        window.location.href='index.html';
    }

    /* DADOS */
    function salvarDados(){
        const s=getS(); if(!s) return;
        const u=getU();
        const nome  = document.getElementById('d-nome').value.trim();
        const email = document.getElementById('d-email').value.trim();
        if(!nome||!email) return alerta('al-dados','Nome e e-mail são obrigatórios.','err');

        const base = u[s.email]||{};
        const novo = {...base, nome,
            telefone: document.getElementById('d-tel').value.trim(),
            cpf:      document.getElementById('d-cpf').value.trim(),
            nasc:     document.getElementById('d-nasc').value };

        if(email !== s.email){
            if(u[email]) return alerta('al-dados','E-mail já em uso.','err');
            u[email] = novo; delete u[s.email];
            sessionStorage.setItem(SK, JSON.stringify({email, nome}));
        } else {
            u[email] = novo;
        }
        savU(u);
        document.getElementById('av').textContent      = ini(nome);
        document.getElementById('sb-nome').textContent = nome;
        document.getElementById('sb-email').textContent= email;
        alerta('al-dados','Dados salvos com sucesso!','ok');
    }

    /* ENDEREÇOS */
    function renderEnds(){
        const s=getS(); if(!s) return;
        const ends=(getU()[s.email]||{}).enderecos||[];
        const lista=document.getElementById('end-list');
        if(!ends.length){
            lista.innerHTML='<p style="color:#555;font-size:.85rem">Nenhum endereço cadastrado ainda.</p>';
            return;
        }
        lista.innerHTML=ends.map((e,i)=>`
            <div class="end-card">
                <div>
                    <p class="end-apelido">${e.apelido||'Endereço '+(i+1)}</p>
                    <p class="end-texto">${e.rua}, ${e.num}${e.comp?' – '+e.comp:''}<br>
                    ${e.bairro?e.bairro+' · ':''}${e.cidade}/${e.uf}<br>CEP: ${e.cep}</p>
                </div>
                <button class="end-del" onclick="delEnd(${i})" title="Remover">✕</button>
            </div>`).join('');
    }

    function toggleFE(){
        const f=document.getElementById('form-end');
        f.classList.toggle('show');
        if(!f.classList.contains('show'))
            ['e-cep','e-rua','e-num','e-comp','e-bairro','e-cidade','e-uf','e-apelido'].forEach(id=>document.getElementById(id).value='');
    }

    async function buscaCEP(){
        const cep=document.getElementById('e-cep').value.replace(/\D/g,'');
        if(cep.length!==8) return alerta('al-end','CEP deve ter 8 dígitos.','err');
        try{
            const d=await(await fetch(`https://viacep.com.br/ws/${cep}/json/`)).json();
            if(d.erro) return alerta('al-end','CEP não encontrado.','err');
            document.getElementById('e-rua').value    = d.logradouro||'';
            document.getElementById('e-bairro').value = d.bairro||'';
            document.getElementById('e-cidade').value = d.localidade||'';
            document.getElementById('e-uf').value     = d.uf||'';
            document.getElementById('e-num').focus();
            document.getElementById('al-end').className='alert';
        }catch{ alerta('al-end','Erro ao buscar CEP.','err'); }
    }

    function salvarEnd(){
        const s=getS(); if(!s) return;
        const rua=document.getElementById('e-rua').value.trim();
        const num=document.getElementById('e-num').value.trim();
        const cidade=document.getElementById('e-cidade').value.trim();
        const uf=document.getElementById('e-uf').value.trim();
        if(!rua||!num||!cidade||!uf) return alerta('al-end','Preencha rua, número, cidade e UF.','err');
        const u=getU();
        if(!u[s.email].enderecos) u[s.email].enderecos=[];
        u[s.email].enderecos.push({
            cep:    document.getElementById('e-cep').value.trim(),
            apelido:document.getElementById('e-apelido').value.trim()||'Endereço',
            rua,num,
            comp:   document.getElementById('e-comp').value.trim(),
            bairro: document.getElementById('e-bairro').value.trim(),
            cidade,uf
        });
        savU(u); toggleFE(); renderEnds();
        alerta('al-end','Endereço salvo!','ok');
    }

    function delEnd(i){
        const s=getS(); if(!s) return;
        const u=getU();
        u[s.email].enderecos.splice(i,1);
        savU(u); renderEnds();
    }

    /* SENHA */
    function salvarSenha(){
        const s=getS(); if(!s) return;
        const u=getU();
        const atual=document.getElementById('s-atual').value;
        const nova=document.getElementById('s-nova').value;
        const nova2=document.getElementById('s-nova2').value;
        if(!atual||!nova) return alerta('al-senha','Preencha todos os campos.','err');
        if(u[s.email].senha!==atual) return alerta('al-senha','Senha atual incorreta.','err');
        if(nova.length<6) return alerta('al-senha','Nova senha deve ter ao menos 6 caracteres.','err');
        if(nova!==nova2) return alerta('al-senha','As senhas não coincidem.','err');
        u[s.email].senha=nova; savU(u);
        ['s-atual','s-nova','s-nova2'].forEach(id=>document.getElementById(id).value='');
        alerta('al-senha','Senha alterada com sucesso!','ok');
    }

    init();
</script>
</body>
</html>
