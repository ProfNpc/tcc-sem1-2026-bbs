<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cliente | Bits Bytes Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff416c;
            --primary-gradient: linear-gradient(45deg, #ff416c, #ff4b2b);
            --bg-base: #050505;
            --glass-bg: rgba(20, 20, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --success: #00ff88;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background-color: var(--bg-base);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(255, 65, 108, 0.08), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(255, 75, 43, 0.08), transparent 40%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--glass-bg);
            padding: 1.2rem 5%;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 4px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            text-decoration: none;
        }

        header a.voltar {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        header a.voltar:hover { color: #fff; }

        /* ── LAYOUT ── */
        .cliente-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .card-auth {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        /* ── TABS ── */
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .tab-btn {
            padding: 20px;
            background: none;
            border: none;
            border-bottom: 2px solid var(--glass-border);
            color: var(--text-muted);
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: #fff;
            border-bottom-color: var(--primary);
        }

        .tab-btn:hover:not(.active) { color: #ddd; }

        /* ── FORMS ── */
        .form-area {
            padding: 40px;
        }

        .form-panel { display: none; }
        .form-panel.active { display: block; }

        .form-panel h2 {
            margin: 0 0 8px;
            font-size: 1.5rem;
        }

        .form-panel p.sub {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 0 0 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .field input:focus {
            border-color: rgba(255,65,108,0.5);
            background: rgba(255,65,108,0.05);
            box-shadow: 0 0 0 3px rgba(255,65,108,0.1);
        }

        .field input::placeholder { color: #555; }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(255,65,108,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255,65,108,0.45);
        }

        .btn-primary:active { transform: translateY(0); }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .link-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 20px;
        }

        .link-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .link-text a:hover { text-decoration: underline; }

        /* ── PAINEL LOGADO ── */
        #painel-logado {
            display: none;
            padding: 40px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 auto 20px;
            box-shadow: 0 0 25px rgba(255,65,108,0.4);
        }

        .painel-nome {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .painel-email {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        .painel-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .painel-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .painel-item:hover {
            background: rgba(255,65,108,0.08);
            border-color: rgba(255,65,108,0.3);
        }

        .painel-item span.icon { font-size: 1.2rem; }

        .btn-logout {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: transparent;
            border: 1px solid rgba(255,65,108,0.4);
            border-radius: 12px;
            color: var(--primary);
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: rgba(255,65,108,0.1);
        }

        /* ── ALERT ── */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
        }

        .alert.error {
            background: rgba(255,65,108,0.1);
            border: 1px solid rgba(255,65,108,0.3);
            color: #ff8a9e;
            display: block;
        }

        .alert.success {
            background: rgba(0,255,136,0.08);
            border: 1px solid rgba(0,255,136,0.25);
            color: var(--success);
            display: block;
        }

        footer {
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.4);
        }

        @media (max-width: 500px) {
            .form-area, #painel-logado { padding: 28px 24px; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" style="text-decoration:none;">
        <h1>BBS</h1>
    </a>
    <a href="index.html" class="voltar">← Voltar à Loja</a>
</header>

<div class="cliente-wrap">
    <div class="card-auth" id="card-auth">

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Entrar</button>
            <button class="tab-btn" onclick="switchTab('cadastro')">Cadastrar</button>
        </div>

        <div class="form-area">

            <!-- LOGIN -->
            <div class="form-panel active" id="panel-login">
                <h2>Bem-vindo de volta</h2>
                <p class="sub">Acesse sua conta BBS</p>

                <div id="alert-login" class="alert"></div>

                <div class="field">
                    <label>E-mail</label>
                    <input type="email" id="login-email" placeholder="seu@email.com">
                </div>
                <div class="field">
                    <label>Senha</label>
                    <input type="password" id="login-senha" placeholder="••••••••" onkeypress="if(event.key==='Enter')fazerLogin()">
                </div>

                <button class="btn-primary" onclick="fazerLogin()">Entrar</button>

                <p class="link-text" style="margin-top:16px;">
                    <a href="#" onclick="switchTab('cadastro');return false;">Esqueci minha senha</a>
                </p>
            </div>

            <!-- CADASTRO -->
            <div class="form-panel" id="panel-cadastro">
                <h2>Criar conta</h2>
                <p class="sub">Junte-se à BBS e monte seu setup</p>

                <div id="alert-cadastro" class="alert"></div>

                <div class="field">
                    <label>Nome completo</label>
                    <input type="text" id="cad-nome" placeholder="Seu nome">
                </div>
                <div class="field">
                    <label>E-mail</label>
                    <input type="email" id="cad-email" placeholder="seu@email.com">
                </div>
                <div class="field">
                    <label>Senha</label>
                    <input type="password" id="cad-senha" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="field">
                    <label>Confirmar senha</label>
                    <input type="password" id="cad-senha2" placeholder="Repita a senha" onkeypress="if(event.key==='Enter')fazerCadastro()">
                </div>

                <button class="btn-primary" onclick="fazerCadastro()">Criar Conta</button>

                <p class="link-text">
                    Já tem conta? <a href="#" onclick="switchTab('login');return false;">Entrar</a>
                </p>
            </div>
        </div>
    </div>

    <!-- PAINEL LOGADO -->
    <div class="card-auth" id="card-painel" style="display:none;">
        <div id="painel-logado">
            <div class="avatar" id="painel-avatar"></div>
            <p class="painel-nome" id="painel-nome"></p>
            <p class="painel-email" id="painel-email-text"></p>

            <div class="painel-menu">
                <a href="index.html" class="painel-item">
                    <span class="icon">🛒</span> Ir às Compras
                </a>
                <div class="painel-item" onclick="mostrarPedidos()">
                    <span class="icon">📦</span> Meus Pedidos
                </div>
                <div class="painel-item" onclick="alert('Em breve!')">
                    <span class="icon">⚙️</span> Configurações da Conta
                </div>
                <div class="painel-item" onclick="alert('Em breve!')">
                    <span class="icon">📍</span> Meus Endereços
                </div>
            </div>

            <button class="btn-logout" onclick="fazerLogout()">Sair da Conta</button>
        </div>
    </div>
</div>

<footer>
    © 2025 Bits Bytes Store · Todos os direitos reservados.
</footer>

<script>
    const STORAGE_KEY = 'bbs_usuarios';
    const SESSION_KEY = 'bbs_sessao';

    function getUsuarios() {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    }

    function saveUsuarios(u) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(u));
    }

    function getSessao() {
        return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
    }

    function showAlert(id, msg, tipo) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.className = 'alert ' + tipo;
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach((b, i) => {
            b.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'cadastro' && i === 1));
        });
        document.getElementById('panel-login').classList.toggle('active', tab === 'login');
        document.getElementById('panel-cadastro').classList.toggle('active', tab === 'cadastro');
    }

    function fazerLogin() {
        const email = document.getElementById('login-email').value.trim();
        const senha = document.getElementById('login-senha').value;
        const usuarios = getUsuarios();

        if (!email || !senha) {
            return showAlert('alert-login', 'Preencha todos os campos.', 'error');
        }

        if (!usuarios[email] || usuarios[email].senha !== senha) {
            return showAlert('alert-login', 'E-mail ou senha incorretos.', 'error');
        }

        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ email, nome: usuarios[email].nome }));
        mostrarPainel();
    }

    function fazerCadastro() {
        const nome = document.getElementById('cad-nome').value.trim();
        const email = document.getElementById('cad-email').value.trim();
        const senha = document.getElementById('cad-senha').value;
        const senha2 = document.getElementById('cad-senha2').value;
        const usuarios = getUsuarios();

        if (!nome || !email || !senha) {
            return showAlert('alert-cadastro', 'Preencha todos os campos.', 'error');
        }
        if (senha.length < 6) {
            return showAlert('alert-cadastro', 'Senha deve ter ao menos 6 caracteres.', 'error');
        }
        if (senha !== senha2) {
            return showAlert('alert-cadastro', 'As senhas não coincidem.', 'error');
        }
        if (usuarios[email]) {
            return showAlert('alert-cadastro', 'Este e-mail já está cadastrado.', 'error');
        }

        usuarios[email] = { nome, senha };
        saveUsuarios(usuarios);
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ email, nome }));
        showAlert('alert-cadastro', 'Conta criada com sucesso!', 'success');
        setTimeout(mostrarPainel, 800);
    }

    function mostrarPainel() {
        const sessao = getSessao();
        if (!sessao) return;

        document.getElementById('card-auth').style.display = 'none';
        document.getElementById('card-painel').style.display = '';

        const iniciais = sessao.nome.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
        document.getElementById('painel-avatar').textContent = iniciais;
        document.getElementById('painel-nome').textContent = sessao.nome;
        document.getElementById('painel-email-text').textContent = sessao.email;
    }

    function fazerLogout() {
        sessionStorage.removeItem(SESSION_KEY);
        document.getElementById('card-auth').style.display = '';
        document.getElementById('card-painel').style.display = 'none';
    }

    function mostrarPedidos() {
        alert('Você ainda não tem pedidos registrados.');
    }

    // Checar sessão ao carregar
    if (getSessao()) mostrarPainel();
</script>

</body>
</html>
