<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Bits Bytes Store</title>

    <!-- Fontes: Chakra Petch (títulos) + Outfit (corpo) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        .subtitle {
  color: rgb(107, 114, 128);
}

        /* ════════════════════════════════
           VARIÁVEIS GLOBAIS
        ════════════════════════════════ */
        :root {
            --red: #ff0022;
            --red-hot: #e01f35;
            --red-glow: rgba(172, 21, 41, 0.5);
            --grad: linear-gradient(135deg, #ac1529 0%, #7a0d1c 100%);
            --bg: #0b0b0b;
            --card-bg: rgba(10, 10, 10, 0.92);
            --border: rgba(255, 255, 255, 0.06);
            --input-bg: rgba(255, 255, 255, 0.04);
            --text: #f0f0f0;
            --muted: #555;
            --font-title: 'Chakra Petch', 'Courier New', monospace;
            --font-body: 'Outfit', 'Trebuchet MS', sans-serif;
            --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ════════════════════════════════
           BODY — fundo escuro base
           Sem pseudo-elementos aqui para não
           conflitar com o z-index do canvas
        ════════════════════════════════ */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-body);
            background: var(--bg);
            overflow: hidden;
        }

        /* ════════════════════════════════
           CANVAS — partículas animadas
           Fica fixo cobrindo toda a tela (z-index 1)
           O card fica acima (z-index 2)
        ════════════════════════════════ */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
        }

        /* ════════════════════════════════
           CARD DE LOGIN
           z-index: 2 — fica acima do canvas
        ════════════════════════════════ */
        .login-card {
            position: relative;
            
            z-index: 10;
            height: 800px;
            width: 100%;
            max-width: 700px;
            padding:200px 90px 90px;
            background: var(--card-bg);
            border-radius: 30px;
            border: 2px solid var(--border);
            backdrop-filter: blur(32px) saturate(160%);
            -webkit-backdrop-filter: blur(32px) saturate(160%);
            box-shadow:
                0 40px 80px rgba(116, 30, 30, 0.8),
                inset 0 1px 0 rgba(187, 23, 2, 0.438),
                0 0 0 1px rgba(179, 49, 49, 0.89);
            animation: cardIn 0.7s var(--bounce) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(80px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(2) scale(1, 5);
            }
        }

        /* Permite animar ângulo do conic-gradient */
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        /* ════════════════════════════════
           BORDA VIAJANTE — percorre as 4 bordas
           mask-composite exclude = mostra só a borda
        ════════════════════════════════ */
        .login-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 20px;
            padding: 2px;
            background: conic-gradient(from var(--angle),
                    transparent 0deg,
                    transparent 290deg,
                    rgb(253, 0, 0) 320deg,
                    #fdfdfd 348deg,
                    #ff6080 354deg,
                    #e01f35 358deg,
                    transparent 360deg);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderSpin 3s linear infinite;
            z-index: 0;
        }

        @keyframes borderSpin {
            to {
                --angle: 360deg;
            }
        }
        /* ════════════════════════════════
           LOGO
        ════════════════════════════════ */
        .logo {
            font-family: var(--font-title);
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-align: center;
            color: #ffffff;
            margin-bottom: 9px;
            position: relative;
            z-index: 1;
        }

        .logo span {    
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 12px var(--red-glow));
        }

        .subtitle {
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 36px;
            position: relative;
            z-index: 1;
        }

        /* ════════════════════════════════
           FORMULÁRIO
        ════════════════════════════════ */
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        input {
            width: 100%;
            padding: 16px 23px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
        }

        input::placeholder {
            color: var(--muted);
        }

        input:focus {
            border-color: rgba(172, 21, 41, 0.6);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(172, 21, 41, 0.1);
        }

        /* ════════════════════════════════
           BOTÃO ACESSAR
        ════════════════════════════════ */
        .btn-entrar {
            width: 100%;
            padding: 19px;
            background: var(--grad);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-family: var(--font-title);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 24px rgba(172, 21, 41, 0.3);
            transition: transform 0.25s var(--bounce), box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-entrar::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: rgba(255, 255, 255, 0.15);
            transform: skewX(-20deg);
            transition: left 0.5s var(--ease);
        }

        .btn-entrar:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(172, 21, 41, 0.5);
        }

        .btn-entrar:hover::after {
            left: 130%;
        }

        .btn-entrar:active {
            transform: translateY(-1px);
        }

        /* ════════════════════════════════
           LINKS EXTRAS
        ════════════════════════════════ */
        .extra-links {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
        }

        .link-btn {
            background: none;
            border: none;
            font-family: var(--font-body);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 10;
            color: var(--muted);
            transition: color 0.25s;
        }

        .link-btn:hover {
            color: var(--text);
        }

        .link-btn.highlight {
            color: var(--red-hot);
            font-weight: 600;
        }

        .link-btn.highlight:hover {
            filter: brightness(1.3);
            text-decoration: underline;
        }

        /* ════════════════════════════════
           LOADER
        ════════════════════════════════ */
        #loader {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 20px 0 10px;
            position: relative;
            z-index: 1;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(172, 21, 41, 0.15);
            border-top-color: var(--red-hot);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            font-family: var(--font-title);
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--red-hot);
            animation: blink 1.2s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ════════════════════════════════
           MODAIS
        ════════════════════════════════ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s var(--ease);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            position: relative;
            background: rgba(10, 10, 10, 0.97);
            width: 100%;
            max-width: 390px;
            padding: 48px 40px 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(172, 21, 41, 0.08);
            text-align: center;
            box-sizing: border-box;
            animation: cardIn 0.4s var(--bounce);
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            border-radius: 24px 24px 0 0;
            background: var(--grad);
        }

        .modal-content h2 {
            font-family: var(--font-title);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 8px;
        }

        .modal-content p {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .modal-content form {
            gap: 12px;
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--muted);
            font-family: var(--font-body);
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 20px;
            transition: color 0.3s;
        }

        .btn-close:hover {
            color: var(--text);
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Canvas do fundo animado (z-index: 1) -->
    <canvas id="bg-canvas"></canvas>

    <!-- Card principal (z-index: 2) -->
    <div class="login-card" id="loginCard">
        <h1 class="logo">BBS <span>Login</span></h1>
 <p class="subtitle" style="color: rgb(255, 255, 255);">Hardwares Premium</p>
        <div id="loader">
            <div class="spinner"></div>
            <p class="loader-text">VERIFICANDO...</p>
        </div>

        <form id="loginForm">
            <input type="text" id="user" placeholder="Usuário" required />
            <input type="password" id="pass" placeholder="Senha" required />
            <button type="submit" class="btn-entrar">Acessar</button>
            <div class="extra-links">
                <button type="button" class="link-btn highlight" onclick="openModal('modalCadastro')">Criar
                    Conta</button>
                <button type="button" class="link-btn" onclick="openModal('modalSenha')">Esqueceu a senha?</button>
            </div>
        </form>
    </div>

    <!-- Modal Cadastro -->
    <div id="modalCadastro" class="modal">
        <div class="modal-content">
            <h2>Novo Cadastro</h2>
            <p>Preencha os dados para criar sua conta.</p>
            <form onsubmit="event.preventDefault(); alert('Conta criada! Faça login.'); closeModal('modalCadastro')">
                <input type="text" placeholder="Nome Completo" required />
                <input type="email" placeholder="E-mail" required />
                <input type="password" placeholder="Crie uma Senha" required />
                <button type="submit" class="btn-entrar" style="margin-top:8px">Finalizar Cadastro</button>
            </form>
            <button class="btn-close" onclick="closeModal('modalCadastro')">← Voltar ao Login</button>
        </div>
    </div>

    <!-- Modal Recuperar Senha -->
    <div id="modalSenha" class="modal">
        <div class="modal-content">
            <h2>Recuperar Acesso</h2>
            <p>Enviaremos um link de recuperação para o seu e-mail cadastrado.</p>
            <form onsubmit="event.preventDefault(); alert('Link enviado!'); closeModal('modalSenha')">
                <input type="email" placeholder="Digite seu E-mail" required />
                <button type="submit" class="btn-entrar" style="margin-top:20rem">Enviar Link</button>
            </form>
            <button class="btn-close" onclick="closeModal('modalSenha')">← Voltar ao Login</button>
        </div>
    </div>

    <script>

        /* ════════════════════════════════
           FUNDO ANIMADO — rede de partículas
           Canvas cobre a tela inteira.
           Pontos vermelhos se movem e se conectam
           com linhas quando ficam próximos.
        ════════════════════════════════ */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let W, H, pts;

        const QTD = 150;     // quantidade de pontos
        const DIST_MAX = 130;    // distância máxima para desenhar linha
        const VEL = 2;   // velocidade dos pontos
        const COR = '239,68,68';
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        function criarPontos() {
            pts = [];
            for (let i = 0; i < QTD; i++) {
                pts.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx: (Math.random() - 0.5) * VEL,
                    vy: (Math.random() - 0.5) * VEL,
                    r: 1.5 + Math.random() * 1.5
                });
            }
        }

        function animar() {
            ctx.clearRect(0, 0, W, H);

            for (let i = 0; i < pts.length; i++) {
                const p = pts[i];

                // Move o ponto e rebate nas bordas
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > W) p.vx *= -1;
                if (p.y < 0 || p.y > H) p.vy *= -1;

                // Desenha o ponto
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${COR},0.75)`;
                ctx.fill();

                // Conecta com pontos próximos
                for (let j = i + 1; j < pts.length; j++) {
                    const q = pts[j];
                    const dx = p.x - q.x;
                    const dy = p.y - q.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < DIST_MAX) {
                        const alpha = (1 - dist / DIST_MAX) * 0.45;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(q.x, q.y);
                        ctx.strokeStyle = `rgba(${COR},${alpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animar);
        }

        window.addEventListener('resize', () => { resize(); criarPontos(); });
        resize();
        criarPontos();
        animar();

        /* ════════════════════════════════
           LOGIN
        ════════════════════════════════ */
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const user = document.getElementById("user").value.trim();
            const pass = document.getElementById("pass").value.trim();

            if (user === "admin" && pass === "1234") {
                const form = document.getElementById("loginForm");
                form.style.transition = "opacity 0.3s";
                form.style.opacity = "0";

                setTimeout(() => {
                    form.style.display = "none";
                    document.getElementById("loader").style.display = "flex";
                }, 300);

                setTimeout(() => {
                    localStorage.setItem("logado", "true");
                    document.getElementById("loginCard").style.transition = "opacity 0.5s";
                    document.getElementById("loginCard").style.opacity = "0";
                    setTimeout(() => { window.location.href = "index.html"; }, 500);
                }, 2200);

            } else {
                alert("Usuário ou senha incorretos!");
            }
        });

        /* ════════════════════════════════
           MODAIS
        ════════════════════════════════ */
        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            const m = document.getElementById(id);
            m.style.transition = "opacity 0.3s";
            m.style.opacity = "0";
            setTimeout(() => { m.style.display = "none"; m.style.opacity = "1"; }, 300);
        }

        window.onclick = function (e) {
            if (e.target.classList.contains('modal')) closeModal(e.target.id);
        }

    </script>
</body>

</html>
